name: Verify live VARD patch once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-vard-live-once.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live VARD has cross-device patch
        run: |
          set -euo pipefail
          curl -sSL -H "Cache-Control: no-cache"             "https://vard-flowers-velora.pages.dev/?verify=20260908-2142"             -o vard.html
          echo "bytes=$(wc -c < vard.html)"
          grep -q 'velora-cross-device' vard.html
          grep -q 'viewport-fit=cover' vard.html
          if grep -q '%%2C' vard.html; then
            echo "Malformed map URL still present"
            exit 1
          fi
          echo "LIVE_PATCH_OK"
