name: Inspect current VARD JS once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-vard-js-once.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch current VARD content.js
        run: |
          set -euo pipefail
          curl -sSL "https://vard-flowers-velora.pages.dev/content.js?inspect=20260908" | head -c 30000
