name: Inspect current VARD source once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-vard-once.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch current VARD HTML
        run: |
          set -euo pipefail
          curl -sSL "https://vard-flowers-velora.pages.dev/?inspect=20260908" | head -c 60000
