name: Live Velora smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VELORA_API_KEY: ${{ secrets.VELORA_API_KEY }}
      BASE_URL: https://velora-deploy-service-production.up.railway.app

    steps:
      - name: Wait for Railway release
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            HEALTH="$(curl -fsS --max-time 15 "$BASE_URL/v1/health" 2>/dev/null || true)"
            BUILD="$(curl -fsS --max-time 15 "$BASE_URL/v1/build" 2>/dev/null || true)"
            if echo "$HEALTH" | grep -q '"ok":true' \
              && echo "$BUILD" | grep -q '"generator":"business-site-v5-russia-safe-proxy"'; then
              echo "Current Railway release is live."
              exit 0
            fi
            sleep 10
          done
          echo "Railway release did not become ready"
          exit 1

      - name: Verify VARD opens through Railway with Android UA
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_UA='Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36'
          STATUS="$(curl -sS -L -A "$ANDROID_UA" -o /tmp/vard.html -w '%{http_code}' --max-time 40 "$BASE_URL/vard/")"
          test "$STATUS" = "200"
          test "$(wc -c < /tmp/vard.html)" -gt 3000
          grep -Eqi 'VARD|Vard|Flowers|цвет' /tmp/vard.html
          echo "VARD HTML works through Railway for Android UA."

      - name: Verify VARD hero asset through Railway
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl -sS -L -o /tmp/hero.jpg -w '%{http_code}' --max-time 40 "$BASE_URL/vard/assets/hero.jpg")"
          test "$STATUS" = "200"
          test "$(wc -c < /tmp/hero.jpg)" -gt 1000
          echo "VARD hero asset works through Railway."

      - name: Verify VARD CMS gateway
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl -sS -L -o /tmp/vard-content.json -w '%{http_code}' --max-time 40 "$BASE_URL/vard-api/content")"
          test "$STATUS" = "200"
          test "$(wc -c < /tmp/vard-content.json)" -gt 20
          echo "VARD CMS is reachable through Railway gateway."

      - name: Verify unauthenticated deploy is rejected
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl -sS -o /tmp/unauth.json -w '%{http_code}' --max-time 20 -X POST \
            "$BASE_URL/v1/deploy" \
            -H 'Content-Type: application/json' \
            --data '{"client_id":"unauth-test","site_build_brief":{"business_name":"Unauthorized"}}')"
          test "$STATUS" = "401"
          grep -q 'UNAUTHORIZED' /tmp/unauth.json

      - name: Create test site and verify Railway public URL
        if: env.VELORA_API_KEY != ''
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl -fsS --max-time 180 -X POST "$BASE_URL/v1/deploy" \
            -H 'Content-Type: application/json' \
            -H "x-velora-api-key: $VELORA_API_KEY" \
            --data '{
              "client_id":"velora-proxy-smoke-001",
              "site_slug":"velora-proxy-smoke-site",
              "template":"vard-baseline",
              "mode":"create_or_update",
              "site_build_brief":{
                "business_name":"Velora Proxy Smoke",
                "headline":"Railway public gateway works",
                "subheadline":"Cross-device public delivery test.",
                "phone":"+7 900 000-00-00",
                "address":"Севастополь",
                "services":[{"title":"Тест","description":"Проверка публичной Railway-ссылки."}]
              }
            }')"
          SITE_URL="$(python - "$RESPONSE" <<'PY'
          import json,sys
          data=json.loads(sys.argv[1])
          if data.get("status")!="OK":
              raise SystemExit("deploy failed: "+str(data))
          url=data.get("site_result_url","")
          if ".up.railway.app/site/" not in url:
              raise SystemExit("expected Railway public URL, got "+url)
          print(url)
          PY
          )"
          ANDROID_UA='Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36'
          BODY="$(curl -fsS -L -A "$ANDROID_UA" --max-time 40 "$SITE_URL")"
          echo "$BODY" | grep -q '<title>Velora Proxy Smoke</title>'
          echo "$BODY" | grep -q 'Railway public gateway works'
          echo "Generated site public Railway URL verified with Android UA."
